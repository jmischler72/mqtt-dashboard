services:
  mqtt-dashboard-app:
    build:
      dockerfile: ./dev/Dockerfile.dev
      context: ..
    ports:
      - "8080:8080"
      - "5173:5173"
    volumes:
      - ..:/app
      # Shadow host node_modules with container-built Linux binaries
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - CONFIG_FILE=/app/dev/config.json



    depends_on:
      - mosquitto
      - mosquitto-password
      - mosquitto-tls


  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data/mosquitto:/mosquitto/data
      - ./mosquitto/log/mosquitto:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"

  mosquitto-password:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto-password.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data/mosquitto-password:/mosquitto/data
      - ./mosquitto/log/mosquitto-password:/mosquitto/log
    ports:
      - "1884:1883"
      - "9002:9001"

  # TLS / mutual-TLS broker — run ./mosquitto/certs/generate.sh first
  mosquitto-tls:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto-tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data/mosquitto-tls:/mosquitto/data
      - ./mosquitto/log/mosquitto-tls:/mosquitto/log
      - ./mosquitto/certs:/mosquitto/certs:ro
    ports:
      - "8883:8883" # MQTT over TLS
      - "9003:9003" # WebSocket over TLS

  # Worker that continuously publishes test messages to all three brokers
  mqtt-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mosquitto
      - mosquitto-password
      - mosquitto-tls
    volumes:
      - ./mosquitto/certs:/certs:ro
    environment:
      - PUBLISH_INTERVAL=5
      - BROKER_PLAIN_HOST=mosquitto
      - BROKER_PLAIN_PORT=1883
      - BROKER_PASS_HOST=mosquitto-password
      - BROKER_PASS_PORT=1883
      - BROKER_PASS_USER=testuser
      - BROKER_PASS_PASS=testpass
      - BROKER_TLS_HOST=mosquitto-tls
      - BROKER_TLS_PORT=8883
      - TLS_CA_CERT=/certs/ca.crt
      - TLS_CLIENT_CERT=/certs/client.crt
      - TLS_CLIENT_KEY=/certs/client.key

volumes:
  frontend_node_modules:
