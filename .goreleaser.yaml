# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mqtt-dashboard

builds:
  - id: mqtt-dashboard
    dir: backend
    main: .
    binary: mqtt-dashboard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -trimpath -X main.version={{.Version}}

archives:
  - id: default
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE.txt
      - config.example.toml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  mode: keep-existing
  replace_existing_artifacts: true
