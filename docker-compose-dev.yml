services:
  mqtt-dashboard-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
      - "5173:5173"
    volumes:
      - .:/app
      # Shadow host node_modules with container-built Linux binaries
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - APP_ENV=development
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./ignore/mosquitto/config:/mosquitto/config
      - ./ignore/mosquitto/data:/mosquitto/data
      - ./ignore/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"

  mosquitto2:
    image: eclipse-mosquitto:2
    volumes:
      - ./ignore/mosquitto2/config:/mosquitto/config
      - ./ignore/mosquitto2/data:/mosquitto/data
      - ./ignore/mosquitto2/log:/mosquitto/log
    ports:
      - "1884:1883"
      - "9002:9001"

volumes:
  frontend_node_modules:
