services:
  mqtt-dashboard:
    image: ghcr.io/jmischler72/mqtt-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - MQTT_DASHBOARD_DEMO_MODE=true
      - MQTT_DASHBOARD_SEED_FILE=/app/dev-seed.json
    volumes:
      - data_volume:/app/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      default:
      dokploy-network:
        aliases:
          - mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-worker:
    build:
      context: ../dev/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - data_volume:/app/data
      - ./reset-db.py:/app/reset-db.py:ro
    environment:
      - PUBLISH_INTERVAL=5
      - BROKER_PLAIN_HOST=mosquitto
      - BROKER_PLAIN_PORT=1883

networks:
  dokploy-network:
    external: true

volumes:
  data_volume:
