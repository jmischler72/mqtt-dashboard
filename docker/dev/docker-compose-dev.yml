# Per-worktree dev environment.
#
# The Compose project name, the hostname and the proxy wiring come from
# docker/dev/.env, which is generated by ./setup-dev-env.sh (run by `make dev-*`).
# Nothing is published to the host: HTTP goes through the shared Traefik proxy at
# http://${WORKTREE_SLUG}.localhost, brokers stay on this project's own network.

services:
  mqtt-dashboard-app:
    build:
      dockerfile: ./docker/dev/Dockerfile.dev
      context: ../..
    volumes:
      - ../..:/app
    # Deps live in /node_modules (see Dockerfile.dev), but Node still resolves
    # /app/frontend/node_modules first, and both sides keep recreating it: the
    # host editor writes .tmp/*.tsbuildinfo there, Vite writes .vite-temp. An
    # empty tmpfs hides whatever the host has and sends those writes to RAM, so
    # the worktree stays clean and nothing shadows the container's Linux builds.
    tmpfs:
      - /app/frontend/node_modules
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - CONFIG_FILE=/app/docker/dev/config.json
      # Page is served on the proxy port, Vite listens on 5173 -> HMR needs this
      - VITE_HMR_CLIENT_PORT=${DEV_PROXY_PORT:-80}
      # Shown in the credits modal so you can tell environments apart
      - VITE_WORKTREE_SLUG=${WORKTREE_SLUG}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${WORKTREE_SLUG}.rule=Host(`${WORKTREE_SLUG}.localhost`)"
      - "traefik.http.routers.${WORKTREE_SLUG}.entrypoints=web"
      - "traefik.http.services.${WORKTREE_SLUG}.loadbalancer.server.port=5173"
      - "traefik.docker.network=mqtt-dev-proxy"
    networks:
      - default
      - proxy
    depends_on:
      - mosquitto
      - mosquitto-password
      - mosquitto-tls

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data/mosquitto:/mosquitto/data
      - ./mosquitto/log/mosquitto:/mosquitto/log

  mosquitto-password:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto-password.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data/mosquitto-password:/mosquitto/data
      - ./mosquitto/log/mosquitto-password:/mosquitto/log

  # TLS / mutual-TLS broker — run ./mosquitto/certs/generate.sh first
  mosquitto-tls:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto-tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data/mosquitto-tls:/mosquitto/data
      - ./mosquitto/log/mosquitto-tls:/mosquitto/log
      - ./mosquitto/certs:/mosquitto/certs:ro

  # Worker that continuously publishes test messages to all three brokers
  mqtt-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mosquitto
      - mosquitto-password
      - mosquitto-tls
    volumes:
      - ./mosquitto/certs:/certs:ro
    environment:
      - PUBLISH_INTERVAL=5
      - BROKER_PLAIN_HOST=mosquitto
      - BROKER_PLAIN_PORT=1883
      - BROKER_PASS_HOST=mosquitto-password
      - BROKER_PASS_PORT=1883
      - BROKER_PASS_USER=testuser
      - BROKER_PASS_PASS=testpass
      - BROKER_TLS_HOST=mosquitto-tls
      - BROKER_TLS_PORT=8883
      - TLS_CA_CERT=/certs/ca.crt
      - TLS_CLIENT_CERT=/certs/client.crt
      - TLS_CLIENT_KEY=/certs/client.key

networks:
  # Implicit per-project bridge: brokers + worker + app, isolated per worktree
  default:
  # Shared with the Traefik proxy only
  proxy:
    external: true
    name: mqtt-dev-proxy
