# TLS broker — requires certificates in /mosquitto/certs/
# Run ignore/mosquitto3/certs/generate.sh to create them first.
#
# To enable mutual TLS (mTLS / client certificate auth):
#   1. Change require_certificate to true
#   2. Restart mosquitto3
#   3. In the dashboard, use auth_mode=certificate and provide client.crt + client.key

listener 8883
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true

listener 9003
protocol websockets
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
